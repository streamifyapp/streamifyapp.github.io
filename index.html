<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08070d"><title>Musify</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PERF NOTES: backdrop-filter only on a few fixed surfaces (player bar, nav, sidebar, menus); cards/rows use fake glass
   (gradients + inner highlights) so scrolling stays cheap. Ambient background is static (no filter, no animation) so
   the blurred bars never re-blur every frame. Off-screen shelves/rows are skipped with content-visibility. */
:root{--bg:#08070d;--t:#f7f4ff;--m:#a8a1c4;--a:#ffd98a;--rose:#ff6b9d;--h:265;--sb:env(safe-area-inset-bottom,0px);--bh:calc(150px + var(--sb));--ease:cubic-bezier(.22,1,.36,1);
--gl:linear-gradient(145deg,#ffffff2e,#ffffff0d 45%,#ffffff18);--edge:inset 0 1px 0 #ffffff5c,inset 0 -1px 0 #00000040,inset 1px 0 0 #ffffff14;--bd:1px solid #ffffff22}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
button,.nv,.card,.row,.chip{touch-action:manipulation}
body{background:var(--bg);color:var(--t);font:14px Manrope,system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden}
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 50% at 12% 8%,hsl(var(--h) 80% 38%/.6),transparent 70%),radial-gradient(50% 45% at 92% 22%,#6c4dff4d,transparent 70%),radial-gradient(60% 50% at 55% 105%,#ff5d8f40,transparent 70%)}
#amb.sw{animation:aw .9s var(--ease)}@keyframes aw{from{opacity:.3}}
h1,h2,.logo{font-family:'Bricolage Grotesque',Manrope,sans-serif}
h1{font-size:32px;font-weight:800;letter-spacing:-.035em;margin:6px 0;line-height:1.05}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.blur,aside.sd,#bar,#mnav,#menu,.mb{backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7)}
aside.sd,#bar,#mnav,#menu,.mb,.btn.o,.ib.g,.chip,.sb input{background:var(--gl);border:var(--bd);box-shadow:var(--edge),0 14px 40px #0006}
#app{height:100dvh}
aside.sd{display:none;padding:22px 14px;overflow:auto;border-radius:30px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.03em;padding:0 10px 22px;display:flex;align-items:center;gap:10px}
.logo i{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#ffe9a8,#ff6b9d);display:grid;place-items:center;color:#1a1200;font-style:normal;font-size:17px;box-shadow:var(--edge),0 6px 20px #ff6b9d66}
.nv{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;color:var(--m);cursor:pointer;font-weight:600;transition:background-color .2s,color .2s}
.nv:hover{background:#ffffff14;color:var(--t)}.nv.on{background:#ffffff22;color:var(--t);box-shadow:inset 0 1px 0 #ffffff40}
.lab{color:var(--m);font-size:12px;padding:20px 14px 6px}
.ic{width:22px;height:22px;flex:none}
main{overflow:auto;padding:0 16px var(--bh);overscroll-behavior:contain;height:100%;-webkit-overflow-scrolling:touch}
.top{position:sticky;top:0;z-index:5;padding:max(12px,env(safe-area-inset-top)) 0 14px;background:linear-gradient(#08070df2 55%,#08070d00)}
.sb{position:relative;max-width:560px;display:block}
.sb input{width:100%;padding:14px 18px 14px 46px;border-radius:30px;color:var(--t);outline:0;font:inherit;font-size:16px;transition:border-color .2s,background-color .2s}
.sb input:focus{border-color:#ffffff77}.sb .ic{position:absolute;left:15px;top:13px;color:var(--m)}
#sg{position:absolute;top:54px;left:0;right:0;border-radius:22px;overflow:hidden;display:none;background:#1a1530f7;border:var(--bd);box-shadow:0 20px 50px #000b;z-index:9}
#sg div{padding:13px 18px;cursor:pointer}#sg div:hover{background:#ffffff14}
.shw{margin-top:28px;content-visibility:auto;contain-intrinsic-size:auto 260px}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ar{display:none;gap:6px}
.sh{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 14px;margin:0 -16px;align-items:flex-start;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain}
.sh::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 150px;width:150px;min-width:0;padding:10px;border-radius:24px;cursor:pointer;scroll-snap-align:start;contain:layout paint style;background:var(--gl),#16122399;border:var(--bd);box-shadow:var(--edge),0 8px 22px #0005;transition:transform .35s var(--ease)}
.card:active{transform:scale(.96)}
@media(hover:hover){.card:hover{transform:translateY(-5px)}}
.qa{position:absolute;right:16px;top:16px;padding:7px;min-width:34px;min-height:34px;background:#000a;color:#fff}
.cv{position:relative;overflow:hidden;width:100%;aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font:800 30px 'Bricolage Grotesque',sans-serif;color:#ffffffcc;box-shadow:0 6px 16px #0006}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#1e1a2c}
.card.artist .cv{border-radius:50%}
.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{margin-top:10px}.card small{color:var(--m);margin-top:3px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:18px;cursor:pointer;min-height:62px;content-visibility:auto;contain-intrinsic-size:auto 62px}
.row>span{display:none;color:var(--m);text-align:center}
.row:active{background:#ffffff14}.row.cur b{color:var(--a)}
.row .cv{width:48px;height:48px;font-size:16px;border-radius:12px;box-shadow:none}
.hero{display:flex;flex-direction:column;gap:18px;padding:14px 0 18px}
.hero .cv{width:190px;border-radius:26px;box-shadow:0 30px 70px hsl(var(--h) 80% 40%/.5),inset 0 1px 0 #fff4}
.hero p{color:var(--m);margin:6px 0 14px}
.btn{padding:12px 24px;border-radius:30px;border:0;font:700 14px Manrope,sans-serif;cursor:pointer;background:linear-gradient(135deg,#ffe9a8,#f5b841);color:#1a1200;min-height:46px;box-shadow:inset 0 1px 0 #fff9,0 8px 26px #f5b84150;transition:transform .2s,filter .2s}
.btn.o{color:var(--t)}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.96)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.chip{padding:26px 16px;border-radius:24px;font:800 17px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;cursor:pointer;transition:transform .3s var(--ease)}.chip:active{transform:scale(.96)}
.ib{background:0;border:0;color:var(--m);cursor:pointer;padding:9px;border-radius:50%;display:grid;place-items:center;min-width:42px;min-height:42px;position:relative;transition:color .2s,transform .2s}
.ib:hover,.ib.on{color:var(--t)}.ib:active{transform:scale(.88)}.ib.h.on{color:var(--rose)}.ib.h.on svg{fill:currentColor}
.rpb.one::after{content:'1';position:absolute;font:800 9px 'Bricolage Grotesque';right:6px;top:5px;color:var(--a)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(74px + var(--sb));height:66px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:0 10px;border-radius:28px;z-index:9;overflow:hidden}
#bar::before{content:'';position:absolute;bottom:0;left:0;height:3px;width:var(--pr,0%);background:linear-gradient(90deg,var(--a),var(--rose))}
.np{display:flex;gap:8px;align-items:center;min-width:0}.npl{display:flex;gap:12px;align-items:center;min-width:0;flex:1;cursor:pointer}.npl>div:last-child{min-width:0;flex:1}.np .cv{width:48px;height:48px;border-radius:14px;flex:none;font-size:16px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}.cb{display:flex;gap:8px;align-items:center;justify-content:center}
.pp{width:48px;height:48px;background:linear-gradient(135deg,#ffe9a8,#f5b841);color:#1a1200!important;box-shadow:inset 0 1px 0 #fff9,0 6px 22px #f5b84177}
.x,.rt,.ctl .sk{display:none}
.sk{display:flex;gap:10px;align-items:center;width:100%;max-width:560px;color:var(--m);font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--a) var(--v,0%),#ffffff2e var(--v,0%));cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0008}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
.rt{justify-content:flex-end;gap:4px;align-items:center}
#mnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(8px + var(--sb));height:58px;border-radius:30px;z-index:9;justify-content:space-around;align-items:center}
#mnav .nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 14px}#mnav .nv.on{color:var(--a);background:0;box-shadow:none}
/* full-screen player */
#fs{position:fixed;inset:0;z-index:40;background:#0a0812;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 22px calc(18px + var(--sb));transform:translateY(100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s;overflow:auto;isolation:isolate}
#fs.on{transform:none;visibility:visible;transition:transform .5s var(--ease)}
.art{position:fixed;inset:-20%;z-index:-1;background:center/cover;filter:blur(60px) saturate(1.7);opacity:.55;transform:translateZ(0);pointer-events:none}
#fs::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 500px at 50% 0,hsl(var(--h) 70% 38%/.6),transparent 70%),linear-gradient(#0a081200,#0a0812e6 85%)}
.fh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
#fsn{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:12px 0;min-height:0}
#fsn .cv{width:min(80vw,360px,42vh);margin:0 auto;border-radius:30px;box-shadow:0 40px 90px hsl(var(--h) 80% 45%/.6),inset 0 1px 0 #fff5;font-size:60px;transform:scale(.88);transition:transform .7s var(--ease)}
#fs.pl #fsn .cv{transform:none}
.ti{display:flex;align-items:center;gap:6px}.ti>div{flex:1;min-width:0}.ti b{font:800 24px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}.ti small{color:var(--m);font-size:14px}
#fs .cb{margin-top:10px;gap:16px}#fs .pp{width:66px;height:66px}
/* lyrics */
#lyr{position:fixed;inset:0;z-index:45;background:#0a0812;overflow:hidden;transform:translateY(100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s;isolation:isolate}
#lyr.on{transform:none;visibility:visible;transition:transform .5s var(--ease)}
#lyr::after{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(600px 500px at 80% 0,hsl(var(--h) 80% 45%/.45),transparent 70%),#0a081299}
.lhd{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;padding:max(14px,env(safe-area-inset-top)) 18px 14px}
.lhd>div{min-width:0;flex:1}.lhd b{font:800 17px 'Bricolage Grotesque',sans-serif}.lhd small{color:var(--m)}
#lsc{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:calc(max(14px,env(safe-area-inset-top)) + 70px) 24px 0;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);scrollbar-width:none}
#lsc::-webkit-scrollbar{display:none}
#lyt{position:relative;font:800 clamp(26px,5.5vw,40px)/1.25 'Bricolage Grotesque',sans-serif;letter-spacing:-.025em;padding-bottom:50vh;max-width:760px;margin:0 auto}
#lyt p{padding:11px 0;color:#ffffff6e;cursor:pointer;transform:scale(.9);transform-origin:left center;opacity:.5;will-change:transform,opacity;transition:transform .7s var(--ease),opacity .7s var(--ease),filter .7s var(--ease)}
#lyt p[data-d="0"]{transform:none;opacity:1}
#lyt p[data-d="1"],#lyt p[data-d="-1"]{opacity:.62}
#lyt p[data-d="2"],#lyt p[data-d="-2"]{opacity:.5;filter:blur(1px)}
#lyt p[data-d="3"],#lyt p[data-d="-3"]{opacity:.38;filter:blur(2px)}
#lyt p[data-d="4"],#lyt p[data-d="-4"],#lyt p[data-d="5"],#lyt p[data-d="-5"],#lyt p[data-d="6"],#lyt p[data-d="-6"]{opacity:.26;filter:blur(3px)}
#lyt.in p{animation:lin .9s var(--ease) backwards;animation-delay:calc(var(--i)*55ms)}
@keyframes lin{from{opacity:0;transform:translateY(34px) scale(.86);filter:blur(8px)}}
.w{transition:color .35s,text-shadow .5s}
#lyt p[data-d="0"] .w{color:#ffffff66}
#lyt p[data-d="0"] .w.lit{color:#fff;text-shadow:0 0 26px hsl(var(--h) 95% 70%/.75)}
#lyt .pl{font:600 19px/1.9 Manrope,sans-serif;white-space:pre-wrap;color:#ffffffcc;cursor:default;transform:none;opacity:1}
.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;margin-right:12px;animation:br 1.6s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes br{0%,100%{transform:scale(.55);opacity:.4}50%{transform:scale(1);opacity:1}}
#menu{position:fixed;border-radius:22px;padding:8px;z-index:70;display:none;min-width:220px;background:#1a1530f7}
#menu div{padding:13px 14px;border-radius:14px;cursor:pointer}#menu div:hover{background:#ffffff14}
#menu .mh{color:var(--m);font-size:12px;cursor:default}
#mod{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:flex-end;justify-content:center}
#mod.on{display:flex}
.mb{width:100%;max-width:520px;max-height:85dvh;overflow:auto;border-radius:30px 30px 0 0;padding:22px 20px calc(22px + var(--sb));background:#1a1530f7}
.mb textarea{width:100%;height:96px;margin:12px 0;padding:12px;border-radius:18px;border:var(--bd);background:#0c0918;color:var(--t);font:16px Manrope,sans-serif;resize:none}
.mb p{color:var(--m);font-size:13px;line-height:1.5}
.spi{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #ffffff14}.spi span{flex:1;min-width:0}
#toast{position:fixed;bottom:calc(var(--bh) + 8px);left:50%;transform:translateX(-50%);max-width:90vw;background:#fffffff2;color:#14101f;padding:11px 20px;border-radius:30px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;text-align:center;box-shadow:0 10px 40px #0008}
#toast.on{opacity:1}
.skl i{display:block;height:150px;border-radius:24px;margin:18px 0;background:linear-gradient(90deg,#ffffff0a,#ffffff1f,#ffffff0a);background-size:200% 100%;animation:sm 1.3s infinite}@keyframes sm{to{background-position:-200% 0}}
#view{animation:vi .5s var(--ease)}@keyframes vi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:800px){#menu{left:12px!important;right:12px;top:auto!important;bottom:calc(var(--bh) + 4px)}}
@media(min-width:801px){
:root{--bh:112px}
#app{display:grid;grid-template-columns:260px 1fr;gap:14px;padding:14px 14px var(--bh)}aside.sd{display:block}
main{padding:0 32px 40px;border-radius:30px;background:linear-gradient(#ffffff0e,#ffffff04);border:1px solid #ffffff18;box-shadow:inset 0 1px 0 #ffffff26}
h1{font-size:44px}.sh{margin:0 -16px;padding:4px 16px 14px}.card{flex-basis:180px;width:180px}.ar{display:flex}
.row{grid-template-columns:30px 48px 1fr auto;gap:14px;padding:8px 14px}.row>span{display:block}.row:hover{background:#ffffff14}
.hero{flex-direction:row;align-items:flex-end;gap:28px}.hero .cv{width:230px}
.chips{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
#bar{left:14px;right:14px;bottom:14px;height:86px;grid-template-columns:1fr 2fr 1fr;gap:16px;padding:0 22px;border-radius:32px}
#bar::before{left:22px;right:22px;width:auto;bottom:0;height:0}
.x{display:grid}.ctl .sk{display:flex}.rt{display:flex}.pp{width:46px;height:46px}
#mnav{display:none}
.mb{border-radius:30px;margin-bottom:10vh;align-self:center}#mod{align-items:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="amb"></div>
<div id="app">
<aside class="sd"><div class="logo"><i>♪</i>Musify</div>
<div class="nv" data-go="home" data-ic="home">Home</div><div class="nv" data-go="search" data-ic="search">Search</div>
<div class="nv" data-go="library" data-ic="lib">Library</div><div class="nv" data-go="liked" data-ic="heart">Liked Songs</div><div class="nv" data-go="queue" data-ic="list">Queue</div>
<div class="nv" data-a="connect" data-ic="plus">Connect Spotify</div>
<div class="lab">Your playlists</div><div id="pls"></div></aside>
<main><div class="top"><form class="sb" id="sf" action="javascript:void 0"><span data-ic="search"></span><input id="inp" type="search" enterkeyhint="search" placeholder="Search songs, artists, albums" autocomplete="off" aria-label="Search"><div id="sg"></div></form></div><div id="view"></div></main>
</div>
<div id="fs" aria-label="Now playing"><div class="art" id="fsb"></div><div class="fh"><button class="ib" data-a="fs" data-ic="down" aria-label="Close"></button><span>Now playing</span><button class="ib" data-a="queue" data-ic="list" aria-label="Queue"></button></div>
<div id="fsn"></div>
<div class="sk"><span class="tc">0:00</span><input type="range" class="seekr" value="0" min="0" max="1000" aria-label="Seek"><span class="td">0:00</span></div>
<div class="cb"><button class="ib shb" data-a="shuffle" data-ic="shuffle" title="Shuffle"></button><button class="ib" data-a="prev" data-ic="prev" title="Previous"></button><button class="ib pp ppb" data-a="pp" title="Play / pause"></button><button class="ib" data-a="next" data-ic="next" title="Next"></button><button class="ib rpb" data-a="repeat" data-ic="repeat" title="Repeat"></button></div>
<div class="cb"><button class="ib" data-a="lyrics" data-ic="lyr" title="Lyrics"></button></div></div>
<div id="lyr" aria-label="Lyrics"><div class="art" id="lyb"></div><div class="lhd"><button class="ib" data-a="lyrics" data-ic="down" aria-label="Close lyrics"></button><div id="lmt"></div></div><div id="lsc"><div id="lyt"></div></div></div>
<div id="mod"><div class="mb"><h2>Connect Spotify</h2><p style="margin-top:6px">Paste one or more <b>public</b> Spotify playlist links. They are saved on this device and shown on your Home page.</p><textarea id="mti" placeholder="https://open.spotify.com/playlist/..."></textarea><div style="display:flex;gap:10px"><button class="btn" data-a="spsave">Save</button><button class="btn o" data-a="mod">Close</button></div><div id="msp"></div></div></div>
<div id="menu"></div><div id="toast"></div>
<footer id="bar">
<div class="np" id="np"></div>
<div class="ctl"><div class="cb">
<button class="ib x shb" data-a="shuffle" data-ic="shuffle" title="Shuffle"></button>
<button class="ib x" data-a="prev" data-ic="prev" title="Previous"></button>
<button class="ib pp ppb" data-a="pp" title="Play / pause"></button>
<button class="ib" data-a="next" data-ic="next" title="Next"></button>
<button class="ib x rpb" data-a="repeat" data-ic="repeat" title="Repeat"></button></div>
<div class="sk"><span class="tc">0:00</span><input type="range" class="seekr" value="0" min="0" max="1000" aria-label="Seek"><span class="td">0:00</span></div></div>
<div class="rt"><button class="ib" data-a="lyrics" data-ic="lyr" title="Lyrics"></button><button class="ib" data-a="queue" data-ic="list" title="Queue"></button>
<input type="range" id="vol" min="0" max="100" value="80" style="flex:none;width:90px" aria-label="Volume"></div>
</footer>
<nav id="mnav"><div class="nv" data-go="home" data-ic="home">Home</div><div class="nv" data-go="search" data-ic="search">Search</div><div class="nv" data-go="library" data-ic="lib">Library</div><div class="nv" data-go="queue" data-ic="list">Queue</div></nav>
<script>
const API='https://musify-api.musify.workers.dev';
const $=(s,e=document)=>e.querySelector(s),$$=s=>document.querySelectorAll(s),q=encodeURIComponent;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zM14 5h4v14h-4z',prev:'M6 6h2v12H6zM9.5 12 18 18V6z',next:'M16 6h2v12h-2zM14.5 12 6 6v12z',down:'M6 9l6 6 6-6',left:'M15 6l-6 6 6 6',right:'M9 6l6 6-6 6',

 au.src=`${API}/stream?v=2&id=${q(s.id)}&t=${q(s.title)}&a=${q(s.sub)}`;au.play().catch(()=>{});
 DB.rec=[s,...DB.rec.filter(x=>x.id!=s.id)].slice(0,20);save();ui();meta(s);document.title=s.title+' • Musify';

/* Auto-queue = YouTube Music "radio" of the playing song (related songs), shared promise so next() can await it */
function more(){if(mp)return mp;if(!cur())return Promise.resolve();

  const u=reg(await api(`/upcoming?id=${q(s.id)}&t=${q(s.title)}&a=${q(s.sub)}`)).filter(x=>!Q.some(y=>y.id==x.id));
  if(u.length){Q.push(...u);Q0.push(...u);break}}}catch{}
 mp=null;if(location.hash=='#/queue')route()})()}

 if(qi>=Q.length-1){const n=Q.length;if(rp!=1)await more();if(Q.length<=n){if(rp==1||!auto)qi=-1;else{au.pause();return ui()}}}

/* ---- synced lyrics (LRCLIB) with line focus, word fill, eased auto-scroll ---- */
async function lyrics(){const s=cur();LY=null;lyI=-2;lyW=-1;lyt.classList.remove('in');
 if(!s){lyt.innerHTML='<p class="pl">Play a song to see its lyrics.</p>';return}
 lyt.innerHTML='<p class="pl">Loading lyrics…</p>';
 const ti=s.title.replace(/[\(\[].*?[\)\]]/g,'').trim(),ar=s.sub.split(/[,&•·]/)[0].trim(),ok=()=>cur()?.id==s.id;
 try{let r=await fetch(`https://lrclib.net/api/get?track_name=${q(ti)}&artist_name=${q(ar)}`),d=r.ok?await r.json():null;
  if(!d?.syncedLyrics){r=await fetch(`https://lrclib.net/api/search?q=${q(ti+' '+ar)}`);const a=r.ok?await r.json():[];d=a.find(x=>x.syncedLyrics)||a[0]||d}
  if(!ok())return;
  if(d?.syncedLyrics){const a=d.syncedLyrics.split('\n').map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);return m?{t:+m[1]*60+ +m[2],x:m[3].trim()}:null}).filter(l=>l&&l.x);
   if(a.length){if(a[0].t>3)a.unshift({t:0,x:'',dots:1});LY=a;
    lyt.innerHTML=a.map((l,j)=>l.dots?`<p class="dots" data-t="0" style="--i:0"><i></i><i></i><i></i></p>`:`<p data-t="${l.t}" style="--i:${Math.min(j,14)}">${l.x.split(/\s+/).map(w=>`<span class="w">${esc(w)}</span>`).join(' ')}</p>`).join('');
    lsc.scrollTop=0;void lyt.offsetWidth;lyt.classList.add('in');return}}
  if(d?.plainLyrics){lyt.innerHTML=`<p class="pl">${esc(d.plainLyrics)}</p>`;return}}catch{}
 try{const x=(await api('/lyrics?id='+q(s.id))).text;if(ok())lyt.innerHTML=`<p class="pl">${esc(x||'No lyrics found for this song.')}</p>`}catch{if(ok())lyt.innerHTML='<p class="pl">No lyrics found for this song.</p>'}}
function lyScroll(el){if(Date.now()<lyUser)return;
 const to=Math.max(0,lyt.offsetTop+el.offsetTop+el.offsetHeight/2-lsc.clientHeight*.36),from=lsc.scrollTop,t0=performance.now(),id=++lyTw;
 (function f(n){if(id!=lyTw)return;const k=Math.min(1,(n-t0)/850);lsc.scrollTop=from+(to-from)*(1-Math.pow(1-k,4));if(k<1)requestAnimationFrame(f)})(t0)}
function lyLoop(){if(!lyr.classList.contains('on')){lyRun=false;return}requestAnimationFrame(lyLoop);if(!LY)return;
 const ct=au.currentTime+.12,ps=lyt.children;let i=-1;for(let j=0;j<LY.length;j++){if(LY[j].t<=ct)i=j;else break}
 if(i!=lyI){lyI=i;lyW=-1;for(let j=0;j<ps.length;j++){const d=Math.max(-6,Math.min(6,j-i));if(ps[j].dataset.d!=d)ps[j].dataset.d=d}
  if(ps[i]){ps[i].querySelectorAll('.lit').forEach(w=>w.classList.remove('lit'));lyScroll(ps[i])}}
 if(i>=0&&!LY[i].dots){const w=ps[i].children,n=w.length,dur=Math.min((LY[i+1]?.t??LY[i].t+4)-LY[i].t,7),c=Math.min(n,Math.floor((ct-LY[i].t)/(dur*.8)*n)+1);
  if(c!=lyW){for(let k=0;k<n;k++)w[k].classList.toggle('lit',k<c);lyW=c}}}
['wheel','touchstart','pointerdown'].forEach(e=>lsc.addEventListener(e,()=>{lyUser=Date.now()+3500;lyTw++},{passive:true}));

function act(a,b={dataset:{}}){const d=b.dataset;
 if(a=='pp'){if(!cur())return;au.paused?au.play().catch(()=>{}):au.pause()}
 else if(a=='next')next();else if(a=='prev')prev();
 else if(a=='shuffle'){sh=!sh;if(sh&&Q.length){Q0=Q0.length?Q0:Q.slice();shufRest()}else if(Q0.length&&cur()){const c=cur().id,ex=Q.filter(x=>!Q0.some(y=>y.id==x.id));Q=[...Q0,...ex];qi=Math.max(0,Q.findIndex(x=>x.id==c))}ui();toast('Shuffle '+(sh?'on':'off'));if(location.hash=='#/queue')route()}
 else if(a=='repeat'){rp=(rp+1)%3;ui();toast(['Repeat off','Repeat all','Repeat one'][rp])}
 else if(a=='like'){const id=d.id||cur()?.id,x=M[id];if(!x)return;DB.liked=liked(id)?DB.liked.filter(y=>y.id!=id):[x,...DB.liked];save();
  $$(`[data-a=like][data-id="${id}"]`).forEach(e=>e.classList.toggle('on',liked(id)));if(/#\/(library|liked)$/.test(location.hash))route()}
 else if(a=='add')menu(b,d.id);

 else if(a=='lyrics'){lyr.classList.toggle('on');if(lyr.classList.contains('on')){lyrics();lyUser=0;if(!lyRun){lyRun=true;requestAnimationFrame(lyLoop)}}}
 else if(a=='fs')$('#fs').classList.toggle('on');
 else if(a=='queue'){$('#fs').classList.remove('on');location.hash=='#/queue'?route():location.hash='#/queue'}
 else if(a=='qclear'){Q=Q.slice(0,qi+1);Q0=Q.slice();route()}
 else if(a=='connect'){$('#mod').classList.add('on');$('#mti').value='';spRender()}else if(a=='mod')$('#mod').classList.remove('on');else if(a=='spsave')spSave();
 else if(a=='sprm'){DB.sp=DB.sp.filter(x=>x!=d.id);save();spRender();if(onHL())route()}
 else if(a=='savepl'){if(DD?.songs.length){DB.pls[DD.title]=DD.songs.slice();save();side();toast('Saved to your library')}}
 else if(a=='playall'&&L[d.k]?.length)play(L[d.k],0);
 else if(a=='shuf'&&L[d.k]?.length){sh=true;ui();play(L[d.k],Math.random()*L[d.k].length|0)}
 else if(a=='newpl'){const n=(prompt('Playlist name')||'').trim();if(n){DB.pls[n]=DB.pls[n]||[];save();side();route()}}
 else if(a=='delpl'&&confirm('Delete playlist “'+d.n+'”?')){delete DB.pls[d.n];save();side();location.hash='#/library'}}
/* Songs picked from search play ALONE; the queue then fills with that song's related radio (not other search matches) */
const inSearch=()=>location.hash.startsWith('#/search');
function open(x,k,i){if(x.type=='song'||x.type=='video')!inSearch()&&L[k]?.[i]?.id==x.id?play(L[k],+i):play([x],0);else if(x.type=='liked')location.hash='#/liked';else if(x.type=='mypl')location.hash='#/my/'+q(x.title);else location.hash=`#/${x.type}/${q(x.id)}`}

document.addEventListener('click',e=>{
 if(e.target.id=='mod'){$('#mod').classList.remove('on');return}
 if(!e.target.closest('#menu')&&!e.target.closest('[data-a=add]'))$('#menu').style.display='none';if(!e.target.closest('.sb'))sg.style.display='none';
 const g=e.target.closest('[data-go]');if(g){location.hash='#/'+g.dataset.go;if(g.dataset.go=='search'&&innerWidth>800)inp.focus();return}
 const my=e.target.closest('[data-my]');if(my){location.hash='#/my/'+q(my.dataset.my);return}
 const ch=e.target.closest('[data-q]');if(ch){go(ch.dataset.q);return}
 const lp=e.target.closest('#lyt p[data-t]');if(lp){au.currentTime=+lp.dataset.t;lyUser=0;return}
 const b=e.target.closest('[data-a]');if(b){act(b.dataset.a,b);return}
 const r=e.target.closest('.row');if(r){const k=r.dataset.k,i=+r.dataset.i;if(k=='q'){qi+=1+i;load()}else if(k=='np')act('pp');else if(k=='s')play([L.s[i]],0);else play(L[k],i);return}
 const c=e.target.closest('.card');if(c&&M[c.dataset.id])open(M[c.dataset.id],c.dataset.k,c.dataset.i)});
document.addEventListener('keydown',e=>{
 if(e.key=='Escape'){$('#fs').classList.remove('on');lyr.classList.remove('on');$('#mod').classList.remove('on')}
 if(e.key=='Enter'&&e.target.classList.contains('card')){e.target.click();return}
 if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.code=='Space'){e.preventDefault();act('pp')}
 else if(e.key=='ArrowRight')e.shiftKey?next():au.currentTime+=5;else if(e.key=='ArrowLeft')e.shiftKey?prev():au.currentTime-=5});
$('#sf').onsubmit=e=>{e.preventDefault();go(inp.value.trim())};
inp.oninput=()=>{clearTimeout(tm);const v=inp.value.trim(),my=++sgT;if(!v){sg.style.display='none';return}
 tm=setTimeout(async()=>{try{const a=await api('/suggest?q='+q(v));if(my!=sgT)return;sg.innerHTML=a.slice(0,8).map(s=>`<div>${esc(s)}</div>`).join('');sg.style.display=a.length?'block':'none'}catch{}},200)};
sg.onclick=e=>{const d=e.target.closest('div');if(d)go(d.textContent)};

side();ui();route();
</script></body></html>

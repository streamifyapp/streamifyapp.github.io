<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musify</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a14;--p:#15121f;--p2:#1e1a2c;--t:#f3f0fa;--m:#9b94b3;--a:#f5b841;--v:#7c5cff;--r:14px}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 75% -10%,#2b1f5c 0,transparent 65%),var(--bg);color:var(--t);font:14px Manrope,system-ui,sans-serif;height:100vh;overflow:hidden}
h1,h2,.logo{font-family:Sora,Manrope,sans-serif}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:8px 0}
h2{font-size:20px;margin:28px 0 14px;font-weight:700}
#app{display:grid;grid-template-columns:248px 1fr;height:calc(100vh - 88px)}
aside{padding:22px 14px;overflow:auto;background:#0f0c1acc;border-right:1px solid #ffffff12}
.logo{font-weight:800;font-size:26px;padding:0 10px 22px;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--a);display:grid;place-items:center;color:#1a1200;font-style:normal;font-size:17px}
.nv{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--m);cursor:pointer;font-weight:600}
.nv:hover,.nv.on{background:#ffffff10;color:var(--t)}.nv.on{box-shadow:inset 3px 0 var(--a)}
.lab{color:var(--m);font-size:12px;padding:20px 12px 6px}
.ic{width:20px;height:20px;flex:none}
main{overflow:auto;padding:0 30px 50px}
.top{position:sticky;top:0;z-index:5;padding:18px 0 14px;background:linear-gradient(var(--bg) 70%,#0c0a1400)}
.sb{position:relative;max-width:540px}
.sb input{width:100%;padding:13px 18px 13px 44px;border-radius:30px;border:1px solid #ffffff1a;background:var(--p2);color:var(--t);outline:0;font:inherit}
.sb input:focus{border-color:var(--a)}.sb .ic{position:absolute;left:15px;top:13px;color:var(--m)}
#sg{position:absolute;top:50px;left:0;right:0;background:var(--p2);border-radius:14px;overflow:hidden;display:none;box-shadow:0 20px 50px #000b}
#sg div{padding:12px 18px;cursor:pointer}#sg div:hover{background:#ffffff12}
.sh{display:flex;gap:16px;overflow:auto;padding-bottom:10px}
.card{flex:0 0 172px;width:172px;min-width:0;padding:12px;border-radius:var(--r);background:#ffffff08;cursor:pointer;transition:background .2s}
.card:hover{background:#ffffff16}
.cv{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;display:grid;place-items:center;font:800 34px Sora,sans-serif;color:#ffffffcc}
.card.artist .cv{border-radius:50%}
img.cv{display:block;height:auto;background:#ffffff10}
.sh{align-items:flex-start}
.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{margin-top:10px}.card small{color:var(--m);margin-top:3px}
.row{display:grid;grid-template-columns:30px 46px 1fr auto;gap:14px;align-items:center;padding:8px 12px;border-radius:10px;cursor:pointer}
.row:hover{background:#ffffff10}.row.cur b{color:var(--a)}
.row .cv{width:46px;height:46px;font-size:16px;border-radius:8px}
.row>span{color:var(--m);text-align:center}
.hero{display:flex;gap:26px;align-items:flex-end;padding:18px 0 22px}
.hero .cv{width:210px;flex:none;border-radius:18px;box-shadow:0 24px 60px #0008}
.hero p{color:var(--m);margin:6px 0 18px}
.btn{padding:12px 26px;border-radius:30px;border:0;font:700 14px Manrope,sans-serif;cursor:pointer;background:var(--a);color:#1a1200}
.btn.o{background:#ffffff16;color:var(--t)}.btn:hover{filter:brightness(1.1)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.chip{padding:26px 16px;border-radius:var(--r);font:700 17px Sora,sans-serif;cursor:pointer}
.ib{background:0;border:0;color:var(--m);cursor:pointer;padding:7px;border-radius:50%;display:grid;place-items:center}
.ib:hover,.ib.on{color:var(--t)}.ib.h.on{color:#ff5d8f}.ib.h.on svg{fill:currentColor}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#bar{position:fixed;bottom:0;left:0;right:0;height:88px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:16px;padding:0 22px;background:#0e0b18e6;backdrop-filter:blur(24px);border-top:1px solid #ffffff14;z-index:9}
.np{display:flex;gap:12px;align-items:center;min-width:0}.np>div{min-width:0;flex:1}.np .cv{width:56px;height:56px;border-radius:10px;flex:none;font-size:18px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}.cb{display:flex;gap:10px;align-items:center}
.pp{width:44px;height:44px;background:var(--a);color:#1a1200!important}
.sk{display:flex;gap:10px;align-items:center;width:100%;max-width:560px;color:var(--m);font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--a) var(--v,0%),#ffffff24 var(--v,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.rt{display:flex;justify-content:flex-end;gap:6px;align-items:center}
#lyr{position:fixed;right:0;top:0;bottom:88px;width:380px;max-width:100%;background:#15121ff5;backdrop-filter:blur(20px);padding:28px;overflow:auto;transform:translateX(100%);transition:transform .3s;z-index:8;white-space:pre-wrap;line-height:1.9;font-size:17px;font-weight:600}
#lyr.on{transform:none}
#menu{position:fixed;background:var(--p2);border-radius:12px;padding:6px;z-index:20;display:none;min-width:200px;box-shadow:0 20px 50px #000b}
#menu div{padding:10px 12px;border-radius:8px;cursor:pointer}#menu div:hover{background:#ffffff14}
#toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--t);color:#14101f;padding:10px 18px;border-radius:30px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.on{opacity:1}
#mnav{display:none}
@media(max-width:800px){
#app{grid-template-columns:1fr;height:calc(100vh - 136px)}aside{display:none}main{padding:0 16px 40px}
#bar{bottom:56px;height:76px;grid-template-columns:1fr auto}.sk,.rt,.x{display:none}
#mnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:56px;background:#0e0b18;z-index:9;justify-content:space-around;align-items:center;border-top:1px solid #ffffff14}
#mnav .nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 14px}#mnav .nv.on{box-shadow:none;color:var(--a)}
#lyr{bottom:132px}.hero{flex-direction:column;align-items:flex-start}.hero .cv{width:160px}h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app">
<aside><div class="logo"><i>♪</i>Musify</div>
<div class="nv" data-go="home" data-ic="home">Home</div><div class="nv" data-go="search" data-ic="search">Search</div>
<div class="nv" data-go="library" data-ic="lib">Library</div><div class="nv" data-go="queue" data-ic="list">Queue</div>
<div class="lab">Your playlists</div><div id="pls"></div></aside>
<main><div class="top"><div class="sb"><span data-ic="search"></span><input id="inp" placeholder="Search songs, artists, albums, playlists" autocomplete="off" aria-label="Search"><div id="sg"></div></div></div><div id="view"></div></main>
</div>
<aside id="lyr" aria-label="Lyrics"></aside>
<div id="menu"></div><div id="toast"></div>
<footer id="bar">
<div class="np" id="np"></div>
<div class="ctl"><div class="cb">
<button class="ib x" id="bsh" data-a="shuffle" data-ic="shuffle" title="Shuffle"></button>
<button class="ib" data-a="prev" data-ic="prev" title="Previous"></button>
<button class="ib pp" id="bpp" data-a="pp" title="Play / pause"></button>
<button class="ib" data-a="next" data-ic="next" title="Next"></button>
<button class="ib x" id="brp" data-a="repeat" data-ic="repeat" title="Repeat"></button></div>
<div class="sk"><span id="tc">0:00</span><input type="range" id="seek" value="0" min="0" max="1000" aria-label="Seek"><span id="td">0:00</span></div></div>
<div class="rt"><button class="ib" data-a="lyrics" data-ic="mic" title="Lyrics"></button><button class="ib" data-a="queue" data-ic="list" title="Queue"></button>
<input type="range" id="vol" min="0" max="100" value="80" style="flex:none;width:90px" aria-label="Volume"></div>
</footer>
<nav id="mnav"><div class="nv" data-go="home" data-ic="home">Home</div><div class="nv" data-go="search" data-ic="search">Search</div><div class="nv" data-go="library" data-ic="lib">Library</div><div class="nv" data-go="queue" data-ic="list">Queue</div></nav>
<script>
/* ====== SET THIS after you deploy the backend (Cloudflare Worker) ======
 Expected endpoints (all GET, JSON unless noted). Item = {type:'song|album|artist|playlist', id, title, sub, thumb}
 /home            -> {sections:[{title, items:[Item]}]}
 /search?q=       -> {songs, videos, albums, artists, playlists}   (arrays of Item)
 /suggest?q=      -> [string]
 /album?id=       -> {title, sub, thumb, songs:[Item]}
 /playlist?id=    -> {title, sub, thumb, songs:[Item]}
 /artist?id=      -> {title, sub, thumb, songs:[Item], albums:[Item], related:[Item]}
 /lyrics?id=      -> {text}
 /upcoming?id=    -> [Item]   (songs that play next / radio)
 /stream?id=      -> audio bytes (proxied, supports Range) */
const API='https://musify-api.musify.workers.dev';
const DEMO=API.includes('YOUR-WORKER');

const $=(s,e=document)=>e.querySelector(s),$$=s=>document.querySelectorAll(s),q=encodeURIComponent;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zM14 5h4v14h-4z',prev:'M6 6h2v12H6zM9.5 12 18 18V6z',next:'M16 6h2v12h-2zM14.5 12 6 6v12z',
shuffle:'M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5',repeat:'M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3',
heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z',plus:'M12 5v14M5 12h14',
list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',mic:'M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v4',
home:'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10',search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',lib:'M4 4v16M9 4v16M14 6l6 14'};
const FILL=['play','pause','prev','next'];
const ic=n=>`<svg viewBox="0 0 24 24" class="ic" ${FILL.includes(n)?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'}><path d="${P[n]}"/></svg>`;
$$('[data-ic]').forEach(e=>e.insertAdjacentHTML('afterbegin',ic(e.dataset.ic)));

/* ---- state ---- */
let DB={liked:[],pls:{},rec:[]};try{DB=Object.assign(DB,JSON.parse(localStorage.getItem('musify')||'{}'))}catch{}
const save=()=>{try{localStorage.setItem('musify',JSON.stringify(DB))}catch{}};
const M={},L={};let Q=[],qi=-1,sh=false,rp=0,busy=false;
const au=new Audio(),V=$('#view'),seek=$('#seek'),vol=$('#vol'),lyr=$('#lyr'),inp=$('#inp'),sg=$('#sg');
const cur=()=>Q[qi],liked=id=>DB.liked.some(x=>x.id==id);
const reg=a=>(a||[]).map(x=>(M[x.id]=x));

/* ---- demo data (used until API is set) ---- */
const T=['Midnight Drive','Neon Skyline','Golden Hour','Velvet Static','Echoes','Afterglow','Paper Planes','Low Tide'],A=['Nova','Kairo','Lumen','Aria','Zenith'];
const D=(n,ty='song')=>Array.from({length:n},(_,i)=>({type:ty,id:'demo'+ty+i,title:T[i%8],sub:ty=='artist'?'Artist':A[i%5],thumb:''}));
const demo=p=>p.startsWith('/home')?{sections:[{title:'Quick picks',items:D(8)},{title:'Albums for you',items:D(6,'album')},{title:'Artists you may like',items:D(6,'artist')},{title:'Playlists',items:D(6,'playlist')}]}
:p.startsWith('/search')?{songs:D(6),albums:D(4,'album'),artists:D(4,'artist'),playlists:D(4,'playlist')}
:p.startsWith('/suggest')?['demo song','demo artist','demo album']:p.startsWith('/lyrics')?{text:'Lyrics appear here once your backend is connected.'}
:p.startsWith('/upcoming')?[]:{title:'Demo',sub:'Connect your backend to load real data',thumb:'',songs:D(8),albums:D(5,'album'),related:D(5,'artist')};
const api=async p=>{if(DEMO){await new Promise(r=>setTimeout(r,200));return demo(p)}const r=await fetch(API+p);if(!r.ok)throw Error(r.status);return r.json()};

/* ---- templates ---- */
const hue=s=>Math.abs([...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;
const cv=x=>x.thumb?`<img class="cv" src="${esc(x.thumb)}" loading="lazy" alt="">`:`<div class="cv" style="background:linear-gradient(135deg,hsl(${hue(x.id)} 55% 42%),hsl(${hue(x.id)+60} 60% 24%))">${esc((x.title||'?')[0])}</div>`;
const card=x=>`<div class="card ${x.type}" tabindex="0" data-id="${esc(x.id)}">${cv(x)}<b class="t">${esc(x.title)}</b><small class="t">${esc(x.sub)}</small></div>`;
const shelf=(t,a)=>a?.length?`<h2>${esc(t)}</h2><div class="sh">${reg(a).map(card).join('')}</div>`:'';
const empty=t=>`<p style="color:var(--m);padding:24px 0">${t}</p>`;
const rows=(k,a)=>{L[k]=reg(a);return L[k].map((x,i)=>`<div class="row${cur()?.id==x.id?' cur':''}" data-k="${k}" data-i="${i}"><span>${i+1}</span>${cv(x)}<div style="min-width:0"><b class="t">${esc(x.title)}</b><small class="t" style="color:var(--m)">${esc(x.sub)}</small></div><div><button class="ib h${liked(x.id)?' on':''}" data-a="like" data-id="${esc(x.id)}" title="Like" data-ic="heart">${ic('heart')}</button><button class="ib" data-a="add" data-id="${esc(x.id)}" title="Add to playlist">${ic('plus')}</button></div></div>`).join('')};
const hero=(x,k,extra='')=>`<div class="hero">${cv(x)}<div><small style="color:var(--m)">${esc(x.type)}</small><h1>${esc(x.title)}</h1><p>${esc(x.sub||'')}</p><button class="btn" data-a="playall" data-k="${k}">Play</button> <button class="btn o" data-a="shuf" data-k="${k}">Shuffle</button> ${extra}</div></div>`;
const MOODS=['Chill','Workout','Focus','Party','Romance','Sleep','Hip-hop','Indie','Bollywood','Lo-fi','Rock','Jazz'];

/* ---- views ---- */
const views={
async home(){const d=await api('/home'),g=new Date().getHours();
 V.innerHTML=`<h1>${g<12?'Good morning':g<18?'Good afternoon':'Good evening'}</h1>`+shelf('Recently played',DB.rec)+d.sections.map(s=>shelf(s.title,s.items)).join('')},
async search(t){if(!t){V.innerHTML=`<h1>Browse</h1><h2>Start with a mood</h2><div class="chips">${MOODS.map(m=>`<div class="chip" data-q="${m}" style="background:linear-gradient(135deg,hsl(${hue(m)} 55% 38%),hsl(${hue(m)+50} 55% 22%))">${m}</div>`).join('')}</div>`;inp.focus();return}
 const d=await api('/search?q='+q(t));
 V.innerHTML=`<h1>Results for “${esc(t)}”</h1>`+(d.songs?.length?`<h2>Songs</h2>`+rows('s',d.songs):'')+shelf('Videos',d.videos)+shelf('Albums',d.albums)+shelf('Artists',d.artists)+shelf('Playlists',d.playlists)},
async detail(k,id){const d=await api(`/${k}?id=${q(id)}`),x={...d,type:k,id},r=rows('d',d.songs);
 V.innerHTML=hero(x,'d')+r+shelf('Albums',d.albums)+shelf('Fans also like',d.related)},
library(){reg(DB.liked);const pl=Object.keys(DB.pls).map(n=>(M['my:'+n]={type:'mypl',id:'my:'+n,title:n,sub:DB.pls[n].length+' songs',thumb:DB.pls[n][0]?.thumb||''}));
 V.innerHTML=`<h1>Your library</h1><div style="margin:14px 0"><button class="btn" data-a="newpl">New playlist</button></div>`+shelf('Playlists',pl)+`<h2>Liked songs</h2>`+(DB.liked.length?rows('lk',DB.liked):empty('Tap the heart on any song to save it here.'))+shelf('Recently played',DB.rec)},
my(n){const s=DB.pls[n];if(!s){V.innerHTML=empty('Playlist not found.');return}const r=rows('my',s);
 V.innerHTML=hero({type:'playlist',id:'my:'+n,title:n,sub:s.length+' songs',thumb:s[0]?.thumb},'my',`<button class="btn o" data-a="delpl" data-n="${esc(n)}">Delete</button>`)+(s.length?r:empty('Use the + button on any song to add it here.'))},
queue(){V.innerHTML=`<h1>Queue</h1>`+(Q.length?rows('q',Q):empty('Nothing queued. Play a song and more will follow.'))}
};
const loading=()=>V.innerHTML='<p style="color:var(--m);padding:40px 0">Loading…</p>';
async function route(){const[k='home',...r]=location.hash.slice(2).split('/'),a=decodeURIComponent(r.join('/'));
 $$('[data-go]').forEach(e=>e.classList.toggle('on',e.dataset.go==k));loading();$('main').scrollTop=0;
 try{['album','artist','playlist'].includes(k)?await views.detail(k,a):await(views[k]||views.home)(a)}
 catch(e){console.error(e);V.innerHTML=empty('Couldn’t load this page. Check your backend URL and connection, then try again.')}}
addEventListener('hashchange',route);
const go=v=>{if(!v)return;inp.value=v;sg.style.display='none';location.hash='#/search/'+q(v)};
const side=()=>$('#pls').innerHTML=Object.keys(DB.pls).map(n=>`<div class="nv" data-my="${esc(n)}">${ic('list')}<span class="t">${esc(n)}</span></div>`).join('')||'<div class="lab" style="padding-top:0">None yet</div>';

/* ---- player ---- */
function play(l,i){Q=l.slice();qi=i;load()}
function load(){const s=cur();if(!s)return;
 if(DEMO)toast('Demo mode: connect your backend to play audio');else{au.src=`${API}/stream?id=${q(s.id)}&t=${q(s.title)}&a=${q(s.sub)}`;au.play().catch(()=>{})}
 DB.rec=[s,...DB.rec.filter(x=>x.id!=s.id)].slice(0,20);save();ui();meta(s);document.title=s.title+' • Musify';
 if(Q.length-qi<3)more();if(lyr.classList.contains('on'))lyrics()}
async function more(){if(busy||DEMO)return;busy=true;try{const u=reg(await api('/upcoming?id='+q(cur().id)));Q.push(...u.filter(x=>!Q.some(y=>y.id==x.id)))}catch{}busy=false}
function next(auto){if(!Q.length)return;
 if(sh&&Q.length>1){let n;do n=Math.random()*Q.length|0;while(n==qi);qi=n}
 else if(qi<Q.length-1)qi++;else if(rp==1||!auto)qi=0;else{au.pause();return ui()}load()}
function prev(){if(au.currentTime>3)au.currentTime=0;else{qi=Math.max(0,qi-1);load()}}
function ui(){const s=cur();
 $('#np').innerHTML=s?`${cv(s)}<div><b class="t">${esc(s.title)}</b><small class="t" style="color:var(--m)">${esc(s.sub)}</small></div><button class="ib h${liked(s.id)?' on':''}" data-a="like" data-id="${esc(s.id)}" title="Like">${ic('heart')}</button>`:'<small style="color:var(--m)">Pick a song to start listening</small>';
 $('#bpp').innerHTML=ic(s&&!au.paused?'pause':'play');$('#bsh').classList.toggle('on',sh);$('#brp').classList.toggle('on',rp>0);$('#brp').title=['Repeat off','Repeat all','Repeat one'][rp];
 $$('.row').forEach(r=>r.classList.toggle('cur',L[r.dataset.k]?.[r.dataset.i]?.id==s?.id))}
function meta(s){if(!('mediaSession'in navigator))return;const m=navigator.mediaSession;
 m.metadata=new MediaMetadata({title:s.title,artist:s.sub,artwork:s.thumb?[{src:s.thumb}]:[]});
 [['play',()=>au.play()],['pause',()=>au.pause()],['nexttrack',()=>next()],['previoustrack',prev]].forEach(([a,f])=>m.setActionHandler(a,f))}
const fmt=s=>isFinite(s)?(s/60|0)+':'+String(s%60|0).padStart(2,'0'):'0:00';
au.ontimeupdate=()=>{const p=au.duration?au.currentTime/au.duration*1000:0;seek.value=p;seek.style.setProperty('--v',p/10+'%');$('#tc').textContent=fmt(au.currentTime);$('#td').textContent=fmt(au.duration)};
seek.oninput=()=>{if(au.duration)au.currentTime=seek.value/1000*au.duration};
vol.oninput=()=>{au.volume=vol.value/100;vol.style.setProperty('--v',vol.value+'%')};vol.oninput();
au.onplay=au.onpause=ui;au.onended=()=>rp==2?(au.currentTime=0,au.play()):next(true);
au.onerror=()=>toast('This track can’t be played right now');
async function lyrics(){const s=cur();if(!s){lyr.textContent='Play a song to see its lyrics.';return}lyr.textContent='Loading lyrics…';
 try{lyr.textContent=(await api('/lyrics?id='+q(s.id))).text||'No lyrics found for this song.'}catch{lyr.textContent='No lyrics found for this song.'}}

/* ---- actions ---- */
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
function menu(b,id){const m=$('#menu'),r=b.getBoundingClientRect();
 m.innerHTML=Object.keys(DB.pls).map(n=>`<div data-p="${esc(n)}">${esc(n)}</div>`).join('')+'<div data-p="">New playlist…</div>';
 m.style.cssText=`display:block;left:${Math.min(r.left,innerWidth-220)}px;top:${Math.min(r.bottom,innerHeight-260)}px`;
 m.onclick=ev=>{const d=ev.target.closest('[data-p]');if(!d)return;let n=d.dataset.p;m.style.display='none';
  if(!n){n=(prompt('Playlist name')||'').trim();if(!n)return;DB.pls[n]=DB.pls[n]||[]}
  if(!DB.pls[n].some(x=>x.id==id))DB.pls[n].push(M[id]);save();side();toast('Added to '+n)}}
function act(a,b={dataset:{}}){const d=b.dataset;
 if(a=='pp'){if(!cur())return;au.paused?au.play().catch(()=>{}):au.pause();if(DEMO)ui()}
 else if(a=='next')next();else if(a=='prev')prev();
 else if(a=='shuffle'){sh=!sh;ui()}else if(a=='repeat'){rp=(rp+1)%3;ui()}
 else if(a=='like'){const id=d.id||cur()?.id,x=M[id];if(!x)return;DB.liked=liked(id)?DB.liked.filter(y=>y.id!=id):[x,...DB.liked];save();
  $$(`[data-a=like][data-id="${id}"]`).forEach(e=>e.classList.toggle('on',liked(id)));if(location.hash=='#/library')route()}
 else if(a=='add')menu(b,d.id);
 else if(a=='lyrics'){lyr.classList.toggle('on');if(lyr.classList.contains('on'))lyrics()}
 else if(a=='queue')location.hash='#/queue';
 else if(a=='playall'&&L[d.k]?.length){sh=false;play(L[d.k],0)}
 else if(a=='shuf'&&L[d.k]?.length){sh=true;play(L[d.k],Math.random()*L[d.k].length|0)}
 else if(a=='newpl'){const n=(prompt('Playlist name')||'').trim();if(n){DB.pls[n]=DB.pls[n]||[];save();side();route()}}
 else if(a=='delpl'&&confirm('Delete playlist “'+d.n+'”?')){delete DB.pls[d.n];save();side();location.hash='#/library'}}
function open(x){if(x.type=='song'||x.type=='video')play([x],0);else if(x.type=='mypl')location.hash='#/my/'+q(x.title);else location.hash=`#/${x.type}/${q(x.id)}`}

document.addEventListener('click',e=>{
 if(!e.target.closest('#menu'))$('#menu').style.display='none';if(!e.target.closest('.sb'))sg.style.display='none';
 const g=e.target.closest('[data-go]');if(g){location.hash='#/'+g.dataset.go;if(g.dataset.go=='search')inp.focus();return}
 const my=e.target.closest('[data-my]');if(my){location.hash='#/my/'+q(my.dataset.my);return}
 const ch=e.target.closest('[data-q]');if(ch){go(ch.dataset.q);return}
 const b=e.target.closest('[data-a]');if(b){act(b.dataset.a,b);return}
 const r=e.target.closest('.row');if(r){play(L[r.dataset.k],+r.dataset.i);return}
 const c=e.target.closest('.card');if(c&&M[c.dataset.id])open(M[c.dataset.id])});
document.addEventListener('keydown',e=>{
 if(e.key=='Enter'&&e.target.classList.contains('card')){e.target.click();return}
 if(/INPUT/.test(e.target.tagName))return;
 if(e.code=='Space'){e.preventDefault();act('pp')}
 else if(e.key=='ArrowRight')e.shiftKey?next():au.currentTime+=5;else if(e.key=='ArrowLeft')e.shiftKey?prev():au.currentTime-=5});
let tm;inp.oninput=()=>{clearTimeout(tm);const v=inp.value.trim();if(!v){sg.style.display='none';return}
 tm=setTimeout(async()=>{try{const a=await api('/suggest?q='+q(v));sg.innerHTML=a.slice(0,8).map(s=>`<div>${esc(s)}</div>`).join('');sg.style.display=a.length?'block':'none'}catch{}},200)};
inp.onkeydown=e=>{if(e.key=='Enter')go(inp.value.trim())};
sg.onclick=e=>{const d=e.target.closest('div');if(d)go(d.textContent)};

side();ui();route();
</script></body></html>
